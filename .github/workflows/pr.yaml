name: Go Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

  test_app:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Check out code
      uses: actions/checkout@v4

    - name: Cache migrate binary
      id: cache-migrate
      uses: actions/cache@v4
      with:
        path: /usr/local/bin/migrate
        key: migrate-v4.18.2

    - name: Install migrate if not cached
      if: steps.cache-migrate.outputs.cache-hit != 'true'
      run: |
        curl -L https://github.com/golang-migrate/migrate/releases/download/v4.18.2/migrate.linux-amd64.tar.gz | tar xz
        sudo mv migrate /usr/local/bin

    - name: Download Go modules
      run: go mod download

    - name: Run tests
      run: make test
